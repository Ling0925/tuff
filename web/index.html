      What a browser needs before it will keep a notification permission, and
      what an installed copy is called.

      The manifest's icons are inset, because a dock icon draws its shape
      inside four fifths of its tile and one that fills the square stands
      taller than everything beside it. The favicon below is not: a tab icon
      is sixteen pixels, and a margin there is four of them thrown away.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Baked from `icon.svg` rather than the SVG itself: a browser draws an
      SVG favicon at sixteen pixels, grain filter and all, and the grain
      came out a speck a pixel and twice as bright as the design.
      `scripts/icons.mjs`.
    -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <!--
      iOS, which masks whatever it is given into the squircle itself — so
      this one is full bleed, where the manifest's are inset for a dock that
      expects the app to supply its own shape.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The standard name, which Chrome asks for, and Apple's, which older
         iPhones still read: both, until the old one is nobody's. -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tuff" />

    <!--
      The theme, before the first paint.

      Resolved here and not in the app because the app starts a beat later,
      and a beat is long enough to show a white screen to somebody who asked
      for a dark one. The same three answers the switch writes: a stated
      preference, or the machine's when there is none.
    -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        /* A public page written out as HTML is dark whatever the visitor
           chose — the landing, Help, the legal pages — and says so on its
           root: */
        var dark =
          document.documentElement.hasAttribute('data-dark-page') ||
          t === 'dark' ||
          (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        /* Somebody signed in who opens `/` is the app, and the landing
           written into the page is not shown to them while it starts. */
        if (localStorage.getItem('session')) document.documentElement.setAttribute('data-signed-in', '')
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        /*
         * And the window's own bar, which an installed copy takes from
         * `theme-color`. Left alone it is whatever the manifest said at
         * install — one colour for ever — so a dark app sat under a white
         * title bar.
         *
         * The two values are `--canvas` in `theme.css`, written here as
         * well because the stylesheet has not arrived yet and a bar that
         * corrects itself a beat later is a white flash on every start.
         * `applyTheme` reads the real token once the sheet is in, so this
         * pair only has to be close enough for one frame.
         */
        var bar = document.createElement('meta')
        bar.name = 'theme-color'
        bar.content = dark ? '#090909' : '#f5f5f7'
        document.head.appendChild(bar)
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <!--
      The ground and the mark before the stylesheet: the colours are
      `--canvas` in `theme.css` — white on a phone in light, the grey on
      anything wider, the near-black in dark — written here because this is
      painted before that sheet has arrived.
    -->
    <style>
      html { background: #f5f5f7; }
      html[data-theme='dark'] { background: #090909; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background-color: #f5f5f7;
      }
      html[data-theme='dark'] #splash { background-color: #090909; }
      @media (max-width: 639px) {
        html:not([data-theme='dark']), html:not([data-theme='dark']) #splash { background-color: #ffffff; }
      }
      #splash img { width: 80px; height: 80px; }
      html[data-signed-in] [data-home] { display: none; }
      #splash[data-later] { animation: splash-in 200ms cubic-bezier(0.23, 1, 0.32, 1) 400ms backwards; }
      #splash[data-going] { opacity: 0; pointer-events: none; transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1); }
      @keyframes splash-in { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #splash[data-later], #splash[data-going] { animation: none; transition: none; }
      }
    </style>

  <body>
    <!--
      The frame, before the app — `docs/specs/arrival.md`.

      The sheets the shell is laid on, drawn from what this browser already
      knows: whether somebody is signed in, how wide the window is, how wide
      they left the sidebar and a project's tools, and whether the address
      is a project. Painted under the app and taken away in the same frame
      the shell is first drawn, which covers it exactly — so what a person
      sees is the window's furniture at once and its contents arriving into
      it, instead of a blank ground and the word "Loading…" in a corner.

      The numbers are the app's: the bar's 48px, `--lift` and `--r-lift`,
      `useColumn('sidebar-width', 248, 200, 380)` and its 56 shut,
      `useWidth('tools-width', 212, 168, 320)`, the screen names `route.ts`
      refuses as projects. Change one there and change it here.
    -->
    <div id="frame" aria-hidden="true"></div>
    <script>
      try {
        var size = function (key, start, min, max) {
          var n = Number(localStorage.getItem(key))
          return n >= min && n <= max ? n : start
        }
        if (localStorage.getItem('session') && matchMedia('(min-width: 1024px)').matches) {
          var side =
            localStorage.getItem('sidebar-width-shut') === '1'
              ? 56
              : size('sidebar-width', 248, 200, 380)
          var parts = location.pathname.split('/')
          var screens = ['notifications', 'members', 'chat', 'settings', 'search', 'projects']
          var project =
            parts[1] && screens.indexOf(parts[1]) < 0 && parts[2] && screens.indexOf(parts[2]) < 0
          var frame = document.getElementById('frame')
          frame.style.paddingLeft = 'calc(var(--lift) * 2 + ' + side + 'px)'
          frame.innerHTML =
            (project ? '<div style="width:' + size('tools-width', 212, 168, 320) + 'px"></div>' : '') +
            '<div style="flex:1"></div>'
        }
      } catch (e) {}
    </script>
    <!--
      The mark, on a phone — installed, or in a tab with a session: there the
      frame above has no sheets to draw, and the ground alone for the second
      it takes the app to start read as a black screen. Over the app rather
      than under it, so it can stay until the first screen's contents are in
      and fade into them, instead of leaving an empty ground between the two.

      At once in an installed copy, where it carries on from the launch image
      iOS has just shown; in a tab only if the start is slow enough to be
      seen, so a quick load is not a logo flashing past. Taken away by the
      app (`letGo` in `App.tsx`), and by itself after eight seconds whatever
      happened, so a start that failed is not a logo for ever.
    -->
    <div id="splash" aria-hidden="true" hidden><img src="/src/splash.png" alt="" /></div>
    <script>
      try {
        var mark = document.getElementById('splash')
        var installed =
          navigator.standalone === true || matchMedia('(display-mode: standalone)').matches
        var narrow = !matchMedia('(min-width: 1024px)').matches
        if (narrow && (installed || localStorage.getItem('session'))) {
          if (!installed) mark.setAttribute('data-later', '')
          mark.hidden = false
          setTimeout(function () {
            mark.remove()
          }, 8000)
        } else mark.remove()
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
