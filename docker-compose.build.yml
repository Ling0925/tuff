# Build the app and the worker from this checkout instead of pulling the
# released image. Added on top of docker-compose.prod.yml:
#
#   COMPOSE_FILE=docker-compose.prod.yml:docker-compose.build.yml   # in .env
#   docker compose up -d --build
#
# For a change of your own, or to run a commit between releases. Updating is
# then yours too: `git fetch --tags && git checkout v1.2.0` and the same
# `up -d --build`, after a backup — `scripts/update.sh` refuses to run on a
# stack built here, since the version it would pin is not what you built.
#
# The same build for both: the worker is the app started with another
# command. The second is answered from the first's cache, in seconds.
x-build: &build
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  image: tuff:source
  pull_policy: build

services:
  app: *build
  worker: *build
