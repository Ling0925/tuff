# Tuff on one machine: Postgres, the app, the worker, and Caddy for TLS.
#
#   scripts/setup.sh tuff.example.com    # writes .env, once
#   docker compose up -d                 # .env names this file
#   scripts/update.sh                    # a newer release, later
#
# The app and the worker run the released image, `ghcr.io/usetuff/tuff`, at
# the version `.env` pins (`TUFF_VERSION`). To build it from this checkout
# instead, add `docker-compose.build.yml` — that file says how.
#
# or, without setup.sh, `docker compose -f docker-compose.prod.yml up -d`
# with a `.env` filled in from `.env.example`. `docs/self-hosting.md` has
# every setting; the deploy spec says where this shape stops.
#
# Everything secret comes from `.env` beside this file — never from here,
# because this file is in git.

# Four roles in one database, as on the service — and the second and third
# are why this file is longer than it looks like it needs to be:
#
#   tracker          owns the tables and runs the migrations. It bypasses
#                    row-level security, so nothing that answers a request
#                    asks as it.
#   tracker_app      every request. Row-level security holds for it: a
#                    query that forgets its workspace gets nothing back.
#   tracker_worker   the worker's own functions — queues, the clear-out.
#   tracker_auth     signing in: passwords, second factors, sessions and
#                    tokens. Nothing to set — its URL and password are made
#                    from DATABASE_URL_APP.
#
# The migrations make the two roles without a password (a password in a
# migration is a password in git), and the app's migration step gives each
# the password in its URL below, on every start. So the passwords live in
# `.env` and nowhere else, and changing one there is a restart. Letters and
# digits only: they are written into a URL as they are.
x-roles: &roles
  DATABASE_URL: postgres://tracker:${POSTGRES_PASSWORD}@postgres:5432/tracker
  DATABASE_URL_APP: postgres://tracker_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (scripts/setup.sh writes it)}@postgres:5432/tracker
  DATABASE_URL_WORKER: postgres://tracker_worker:${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD in .env (scripts/setup.sh writes it)}@postgres:5432/tracker
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (scripts/setup.sh writes it)}
  # The image says these already; said again here because every line of
  # `.env` reaches the containers, and a stray `NODE_ENV=development` there
  # would print sign-in links to the log and lift the limits for local
  # addresses.
  NODE_ENV: production
  STORAGE_DIR: /data/storage
  WEB_DIR: /app/web/dist

# Everything else in `.env` — mail, sign-in providers, push, a bucket —
# reaches the app and the worker as it is, so a setting is one line there.
# What is said above wins over any line of the same name in it.
x-env-file: &env-file
  - path: .env
    required: false

services:
  # The database, on a volume that outlives the containers.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (scripts/setup.sh writes it)}
      POSTGRES_DB: tracker
    # The app's backups too, read-only, so restoring one is a single
    # `exec` here — `docs/self-hosting.md`, "Backups".
    volumes: ['pgdata-prod:/var/lib/postgresql/data', 'db-backups:/backups:ro']
    # No published port. The database is reachable from the other
    # containers on the compose network and from nowhere else — a Postgres
    # on the public internet is found by scanners within the hour.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracker -d tracker']
      interval: 5s
      timeout: 3s
      retries: 20

  # The API and the client, from one origin.
  #
  # A pinned release, never `latest`: what runs changes when somebody
  # decides it should (`scripts/update.sh`), not when the image is next
  # pulled. `TUFF_IMAGE` is for a registry of your own that mirrors it.
  app:
    image: ${TUFF_IMAGE:-ghcr.io/usetuff/tuff}:${TUFF_VERSION:?set TUFF_VERSION in .env (scripts/setup.sh writes it), e.g. TUFF_VERSION=1.0.0}
    restart: unless-stopped
    env_file: *env-file
    environment:
      <<: *roles
      # This container owns the schema and sets the two roles' passwords;
      # the worker waits for it. One place that migrates means two of them
      # cannot race, whatever the lock says.
      MIGRATE_ON_START: '1'
      PORT: '8787'
      # The owner's address, which alone may claim a server nobody owns
      # yet (scripts/setup.sh asks for it). Named here, though `.env`
      # would pass it anyway, because the app is what tells the database
      # on every start; empty lets any address claim it through the setup
      # link, or — with no SETUP_TOKEN either — the first confirmed sign-up.
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      # The setup link's token (scripts/setup.sh writes it), told to the
      # database on every start while nobody owns the server.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Before it migrates anything, the app dumps the database here
      # (`db-backups`), and does not start if it can't. Kept
      # BACKUP_RETENTION_DAYS (30); SKIP_PRE_MIGRATION_BACKUP=1 in `.env`
      # skips it. `docs/self-hosting.md`, "Backups".
      BACKUP_DIR: /backups
    # Uploads, unless a bucket is configured. A named volume and not a bind
    # mount: without one, every rebuild loses every file anybody has
    # attached — which looks like a working install right up to the moment
    # somebody looks for a document.
    volumes: ['uploads:/data/storage', 'db-backups:/backups']
    # The image's check, with five minutes to come up: the backup and the
    # migrations run before the app answers, and a large database takes a
    # while to dump. Failures inside the start period don't count.
    healthcheck:
      start_period: 5m
    depends_on:
      postgres: { condition: service_healthy }

  # The same image, started differently.
  #
  # Without it mail is not sent, webhooks never fire and nothing is ever
  # really deleted — all of which look like working features until somebody
  # checks. It is also what makes a deletion true: the clear-out is where
  # deleted rows actually go.
  worker:
    image: ${TUFF_IMAGE:-ghcr.io/usetuff/tuff}:${TUFF_VERSION:?set TUFF_VERSION in .env (scripts/setup.sh writes it), e.g. TUFF_VERSION=1.0.0}
    restart: unless-stopped
    command: ['node', '--conditions=compiled', 'server/dist/worker.js']
    env_file: *env-file
    environment:
      <<: *roles
    volumes: ['uploads:/data/storage']
    # The image's health check asks for a page, and the worker serves none.
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      # Started, not healthy: the app backs the database up before it
      # migrates, which takes as long as the database is large, and
      # `docker compose up -d` waiting on its health gave up on a long
      # backup. The worker waits for the migrations itself, for as long as
      # they take. On a first start it may sign in before the app has given
      # its role a password; it is restarted until it can.
      app: { condition: service_started }

  # TLS, and the only thing on the public internet.
  #
  # Caddy rather than nginx for one reason: it gets and renews the
  # certificate by itself from the domain name below. A certificate that
  # expires on a Sunday is the outage nobody schedules. `DOMAIN=localhost`
  # gets a certificate of Caddy's own, for trying it on one machine.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (scripts/setup.sh writes it)}
      # Where the redirect from plain HTTP sends people.
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_started }

volumes:
  # Not `pgdata`, which the development database once used in the same
  # folder — with its password `tracker`.
  pgdata-prod:
  uploads:
  # The database as it was before each migration, 30 days of them.
  db-backups:
  caddy_data:
  caddy_config:
