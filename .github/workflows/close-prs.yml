# Pull requests are not taken (CONTRIBUTING.md says why), so one that
# opens is closed at once, with a word saying where to go instead.
name: Close pull requests

on:
  # pull_request_target runs in the base repository with its token, so it
  # can close a pull request from a fork. It never checks out or runs the
  # pull request's code: there is no checkout step here, and must never be.
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close with a pointer to Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$NUMBER" --comment "Thank you for taking the time. This repository does not take pull requests — CONTRIBUTING.md says why. If this fixes a problem or adds something you need, please open an issue describing it, and it will be looked at there: https://github.com/${GH_REPO}/issues"
