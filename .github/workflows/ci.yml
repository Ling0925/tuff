# Every push to main: what a fresh checkout of the public repository builds
# and passes. The types, the permission matrix, the server's tests against
# a real Postgres — row-level security, workspace isolation, the community
# edition's own — the web build, the image for both platforms, built
# and not pushed, and `scripts/setup.sh --try` started as the README says.
#
# The browser tests (Playwright, `e2e/`) are not here: they need a seeded
# server and a browser, and run with `pnpm check` before each commit lands
# on main. Run them yourself with `pnpm check` (the README says how).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports: ['5455:5432']
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker"
          --health-interval 2s --health-timeout 3s --health-retries 30
    # The same roles as a server: the migrations make tracker_app and
    # tracker_worker, and give them the passwords in these URLs, and
    # tracker_auth, whose URL and password are made from DATABASE_URL_APP.
    env:
      DATABASE_URL: postgres://tracker:tracker@localhost:5455/tracker
      DATABASE_URL_APP: postgres://tracker_app:tracker_app@localhost:5455/tracker
      DATABASE_URL_WORKER: postgres://tracker_worker:tracker_worker@localhost:5455/tracker
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: The permission matrix
        run: pnpm --filter @tracker/shared-schema test
      - name: Generated types match the schema
        run: |
          pnpm generate
          git diff --exit-code --stat shared-schema/generated \
            || { echo "::error::shared-schema/generated is stale: run pnpm generate"; exit 1; }
      - name: Migrations
        run: pnpm --filter @tracker/server migrate
      - name: Server tests
        run: pnpm --filter @tracker/server test
      - name: Web tests
        run: pnpm --filter @tracker/web test
      - name: Build
        run: pnpm build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image, without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The README's first command, as a stranger runs it: `scripts/setup.sh
  # --try` builds this checkout, starts it on plain http://localhost, and
  # the setup link answers. Then the same again, which must keep the data,
  # and the refusal of a real server's address with TRY_LOCALHOST=1.
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Try it
        run: scripts/setup.sh --try --no-open
      - name: The setup link opens the setup screen, on localhost only
        run: |
          port=$(sed -n 's/^TRY_PORT=//p' .env.try)
          token=$(sed -n 's/^SETUP_TOKEN=//p' .env.try)
          curl -fsS "http://localhost:$port/setup?token=$token" | grep -q 'name="tuff-setup" content="open"'
          curl -fsS -H "x-setup-token: $token" "http://localhost:$port/auth/setup"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: tuff.example.com' "http://127.0.0.1:$port/health")" = 421
      - name: Run again, with the same install
        run: |
          before=$(sed -n 's/^SETUP_TOKEN=//p' .env.try)
          scripts/setup.sh --try --no-open
          test "$(sed -n 's/^SETUP_TOKEN=//p' .env.try)" = "$before"
      - name: A real server's address refuses to start
        run: |
          image=$(sed -n 's/^TUFF_TRY_IMAGE=//p' .env.try)
          ! timeout 60 docker run --rm -e TRY_LOCALHOST=1 -e APP_URL=https://tuff.example.com -e JWT_SECRET=ci-only \
            -e DATABASE_URL=postgres://nobody@127.0.0.1:1/none "$image" 2> refused.log
          grep -q 'Refusing to start' refused.log
      - name: What the app said
        if: failure()
        run: |
          project=$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env.try)
          docker compose -p "$project" -f docker-compose.try.yml --env-file .env.try logs app worker
