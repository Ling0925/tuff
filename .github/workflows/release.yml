# A release, from its tag. The release commit sets server/src/version.ts
# and CHANGELOG.md, the commit is tagged vX.Y.Z, and pushing that tag
# starts this:
#
#   - the image for linux/amd64 and linux/arm64, pushed to
#     ghcr.io/usetuff/tuff as X.Y.Z, X.Y and latest;
#   - build provenance (SLSA) and an SBOM, attached to the image by
#     BuildKit, and a provenance attestation signed through GitHub's
#     Sigstore, checkable with `gh attestation verify`;
#   - a keyless cosign signature on the image's digest;
#   - the GitHub release, with that version's section of CHANGELOG.md.
#
# A section with a `### Security` heading makes a security release: every
# server of one's own that checks for releases (`server/src/updates.ts`)
# reads that heading in the notes below and puts a red dot on its owners'
# faces until they update. Keep the heading in the notes; nothing else
# marks one.
#
# Every action is pinned to a full commit, with its version beside it: a
# tag can be moved by whoever controls the action's repository, a commit
# cannot.
name: Release

on:
  push:
    tags: ['v*.*.*']

# Nothing by default; the job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # the GitHub release
      packages: write        # push to ghcr.io
      id-token: write        # keyless signing and attestations (OIDC)
      attestations: write    # GitHub's provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag and the code it points at agree, and the changelog has the
      # version's section — or nothing is built.
      - name: Check the tag against the code
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          version=${TAG#v}
          grep -qF "export const VERSION = '$version'" server/src/version.ts \
            || { echo "::error::server/src/version.ts does not say $version"; exit 1; }
          awk -v v="$version" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            /^\[[^]]+\]: / { if (on) exit }
            on' CHANGELOG.md \
            | perl -0pe 's/<!--.*?-->\n?//gs; s/\A\s+//; s/\s+\z/\n/' > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z, X.Y and latest, and the OCI labels that say which version,
      # commit and date. Releases are cut from main, newest first, so the
      # tag being built is the highest and takes `latest`.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Tuff
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/self-hosting.md
            org.opencontainers.image.url=https://usetuff.com

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          # SLSA provenance with the full build record, and an SPDX SBOM,
          # both attached to the image in the registry.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the certificate says this workflow, in this repository, at
      # this tag, signed it. Nothing secret to keep or leak.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            cat "$RUNNER_TEMP/notes.md"
            cat <<EOF

          ---

          **Update:** \`git fetch --tags && git checkout v$VERSION && scripts/update.sh $VERSION\`, or back up, set \`TUFF_VERSION=$VERSION\` in \`.env\`, and run \`docker compose pull && docker compose up -d\`.

          **Image:** \`$IMAGE:$VERSION\` for linux/amd64 and linux/arm64, digest \`$DIGEST\`.

          **Verify** the signature and the provenance:

          \`\`\`bash
          cosign verify $IMAGE:$VERSION \\
            --certificate-identity-regexp '^https://github.com/$GH_REPO/\.github/workflows/release\.yml@refs/tags/v' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://$IMAGE:$VERSION -R $GH_REPO
          \`\`\`
          EOF
          } > "$RUNNER_TEMP/release.md"
          gh release create "$TAG" --verify-tag --title "Tuff $VERSION" --notes-file "$RUNNER_TEMP/release.md"
