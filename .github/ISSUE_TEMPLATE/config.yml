# The public repository's issue chooser. Blank issues are off so a report
# arrives with its version and logs; questions go to Discussions, and a
# vulnerability never into an issue.
blank_issues_enabled: false
contact_links:
  - name: Question or help with your server
    url: https://github.com/usetuff/tuff/discussions
    about: Ask how to install, configure or use Tuff. Others running it can answer too.
  - name: Security problem
    url: https://github.com/usetuff/tuff/security/advisories/new
    about: Report a vulnerability privately. Please don't open a public issue.
  - name: Something on usetuff.com
    url: https://usetuff.com
    about: The hosted service has its own support at hello@usetuff.com.
