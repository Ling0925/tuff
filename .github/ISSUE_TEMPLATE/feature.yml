name: Feature request
description: Something Tuff doesn't do and you'd like it to.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Tuff keeps to a few things done well, so not every request is built, but every one is read.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem, in your own work. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. A sketch or a screenshot from another app is welcome.
  - type: dropdown
    id: where
    attributes:
      label: Where you use Tuff
      options:
        - My own server
        - usetuff.com
        - Both
