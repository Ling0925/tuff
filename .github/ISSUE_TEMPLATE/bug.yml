name: Bug report
description: Something in Tuff doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A security problem doesn't go here: report it privately, as [SECURITY.md](https://github.com/usetuff/tuff/blob/main/SECURITY.md) says.

        If this happens on usetuff.com rather than on your own server, write to hello@usetuff.com instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Open a project's Tasks
        2. Drag a task to Done
        3. It jumps back to In progress
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`TUFF_VERSION` in your `.env`, or `version` from `https://your-server/health`."
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How you run it
      options:
        - Docker Compose with the released image
        - Docker Compose, built from source
        - Something else (say below)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Machine and browser
      description: The server's OS and architecture, a proxy in front of Caddy if any, and the browser where you saw it.
      placeholder: Ubuntu 24.04 on arm64, behind nginx; Safari 19
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The app's and the worker's log from around the time it happened: `docker compose logs --since 1h app worker`. Remove anything private (addresses, names) before you paste it.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, settings you changed from the defaults (never passwords or keys), or whether it started after an update.
