# Tuff tried on this computer: Postgres, the app and the worker, at
# http://localhost:<port> — no Caddy, no TLS, no domain.
#
#   scripts/setup.sh --try     # writes .env.try, starts this, opens the browser
#
# Not for a server. `scripts/try.sh` writes `.env.try` and starts this file
# under a compose project of its own, so it never reads `.env` and never
# touches a real install in the same folder.
#
# Everything comes from `.env.try` by interpolation, and only what is named
# below reaches the containers: the production file reads the whole of
# `.env` into them, which is why this one stands alone rather than on top
# of it.

x-roles: &roles
  DATABASE_URL: postgres://tracker:${POSTGRES_PASSWORD:?run scripts/setup.sh --try}@postgres:5432/tracker
  DATABASE_URL_APP: postgres://tracker_app:${APP_DB_PASSWORD:?run scripts/setup.sh --try}@postgres:5432/tracker
  DATABASE_URL_WORKER: postgres://tracker_worker:${WORKER_DB_PASSWORD:?run scripts/setup.sh --try}@postgres:5432/tracker
  JWT_SECRET: ${JWT_SECRET:?run scripts/setup.sh --try}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  APP_URL: ${APP_URL:?run scripts/setup.sh --try}
  # Plain http on this computer: the server refuses it with any APP_URL but
  # http://localhost or http://127.0.0.1, and answers only requests
  # addressed to localhost.
  TRY_LOCALHOST: '1'
  NODE_ENV: production
  STORAGE_DIR: /data/storage
  WEB_DIR: /app/web/dist

# The release's image, pulled; or this checkout, built (`TUFF_TRY_PULL=build`,
# which scripts/try.sh sets when there is no image to pull). An image name of
# its own when built (`tuff:try-<six>`, per checkout), so a real install's
# `tuff:source` and another folder's try install are never replaced.
x-image: &image
  image: ${TUFF_TRY_IMAGE:?run scripts/setup.sh --try}
  pull_policy: ${TUFF_TRY_PULL:-build}
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-unknown}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh --try}
      POSTGRES_DB: tracker
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracker -d tracker']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    <<: *image
    restart: unless-stopped
    environment:
      <<: *roles
      MIGRATE_ON_START: '1'
      PORT: '8787'
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    # This computer only: published on the loopback address, never on the
    # network.
    ports: ['127.0.0.1:${TRY_PORT:?run scripts/setup.sh --try}:8787']
    volumes: ['uploads:/data/storage']
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    <<: *image
    restart: unless-stopped
    command: ['node', '--conditions=compiled', 'server/dist/worker.js']
    environment:
      <<: *roles
    volumes: ['uploads:/data/storage']
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      app: { condition: service_healthy }

# Each labelled with the folder whose try install made it, so
# `setup.sh --try --fresh` deletes only those — never a real install's
# volumes, whatever a project is called.
volumes:
  pgdata:
    labels:
      tuff.try.root: ${TRY_ROOT:?run scripts/setup.sh --try}
  uploads:
    labels:
      tuff.try.root: ${TRY_ROOT:?run scripts/setup.sh --try}
