# The development database, for `pnpm dev`, `pnpm check` and the tests —
# never a server people use. `pnpm db:up` starts it.
#
# Named, not `docker-compose.yml`: a bare `docker compose up` in a fresh
# clone found this one and started a Postgres whose password is in git. Now
# it finds nothing, and a server of your own is `scripts/setup.sh` and
# `docker-compose.prod.yml`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    # This machine only. Docker writes its own firewall rules, past ufw,
    # and `tracker`/`tracker` on an open port is a database for anybody.
    ports: ['127.0.0.1:5455:5432']
    volumes: ['pgdata-dev:/var/lib/postgresql/data']
    command:
      # Connections are held by each process's pool (server/src/db.ts), not
      # by Postgres itself. 200 is generous on purpose: in development the
      # server, the worker and the test files each open a pool of their own.
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracker -d tracker']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  # Named as it was before this file was renamed, so the data stayed
  # where it was. The server's compose file calls its own `pgdata-prod`:
  # the two once shared `<folder>_pgdata`, and a server started in the
  # same folder would have opened this one, password `tracker` and all.
  pgdata-dev:
    name: projecttracker_pgdata
